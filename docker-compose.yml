services:
  app:
    build: .
    ports: 
      - "8000:8000"
    environment:
      EMAIL_USERNAME: ""
      EMAIL_PASSWORD: ""
    volumes:
      - ./MMORPG_board/:/MMORPGBoardApp/
      - ./db_test.sqlite3:/MMORPGBoardApp/db.sqlite3
    depends_on:
      - redis
  redis:
    image: redis:alpine
    ports:
      - 6379:6379
  celery:
    build: .
    environment:
      EMAIL_USERNAME: ""
      EMAIL_PASSWORD: ""
    command: celery -A MMORPG_board worker -l info
    volumes:
      - ./db_test.sqlite3:/MMORPGBoardApp/db.sqlite3
    depends_on:
      - redis
      - app